spring.application.name=BILLING
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/billing?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.timeout=${SESSION_TIMEOUT_MINUTES:30}m
app.security.default-session-timeout-minutes=${SESSION_TIMEOUT_MINUTES:30}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.security.maximum-concurrent-sessions=${MAX_CONCURRENT_SESSIONS:1}
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
management.endpoints.web.exposure.include=health,info
